# Texte der 404-Seite (Board 11a).
# GitHub Pages zeigt diese eine Seite für jede Adresse, die es nicht gibt – in
# jeder Sprache. Deshalb ist die Seite deutsch (`de`) und hat einen englischen
# Absatz (`en`) mit einem Link zur englischen Startseite.
- id: not-found
  # Entwurf aus dem Design – von Celine zu prüfen
  de:
    label: Fehler 404
    title: Diese Seite gibt es nicht
    # Das Handy-Board endet anders: „Alles, was es hier gibt, steht darunter.“
    # Die Seite hat einen Text für beide Breiten; dieser ist der vom Desktop.
    intro: Vielleicht ist der Link alt oder die Adresse hat einen Tippfehler. Alles, was es auf dieser Website gibt, steht hier.
    # Beschriftung des Mail-Links. Die Adresse kommt aus site/site.yaml.
    report: Kaputter Link gefunden? Kurze Mail genügt
    onward:
      heading: Weiter zu
      # Eine Zeile je Seite der Navigation, benannt über ihren translationKey.
      # Titel und Adresse kommen aus der Seite selbst. Fehlt hier eine Seite
      # der Navigation oder steht hier eine, die es dort nicht gibt, bricht der
      # Build ab.
      descriptions:
        research: Projekte, Methoden und laufende Studien
        publications: Alle Arbeiten, chronologisch, mit DOI
        # Nennt nur, was die Seite heute zeigt – derselbe Text wie auf der
        # Startseite. Pressekit erst ergänzen, wenn die Datei existiert.
        talks-media: Vorträge und Themen für Redaktionen
        # Nennt nur, was die Seite heute zeigt – derselbe Text wie auf der
        # Startseite. PDF-Download erst ergänzen, wenn die Datei existiert.
        cv: Ausbildung, Positionen, Förderung und Publikationen
        contact: Mail, Institut, Profile
  en:
    # EN: Übersetzung – von Celine zu prüfen
    text: This page does not exist. The link may be out of date, or the address may contain a typo.
    link: Go to the English home page
