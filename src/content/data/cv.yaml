# Lebenslauf-Einträge (Board 7b). Sprachneutral gepflegt, nur Titel und Details
# sind übersetzt.
#
# Regeln
# - Nur Belegtes: Quelle ist Celines öffentliches ORCID-Profil (0000-0002-3802-1339),
#   Stand der Abfrage 2026-09-16. Jeder Eintrag nennt seine Quelle (put-code).
# - Daten in der Genauigkeit, die ORCID angibt: 2019, 2022-10 oder 2023-10-01.
#   Ohne `end` schreibt die Seite „seit …“.
# - Alles andere ist ein Platzhalter: `placeholder: true`, Titel beginnt mit
#   „PLATZHALTER –“ / „PLACEHOLDER –“. Das Beispiel aus dem Design steht als
#   Kommentar daneben – es ist NICHT geprüft und darf so nicht übernommen werden.
# - Publikationen stehen nicht hier: Die Seite liest sie aus publications.yaml.
# - Englisch ist der ORCID-Wortlaut; Deutsch ist übersetzt (# DE: …).

# --- Ausbildung ---------------------------------------------------------------

# Design-Beispiel (nicht geprüft): „seit 2023 · Doktorat Psychologie, Universität Wien“.
# ORCID führt eine Ausbildung an der Universität Wien ohne Abschluss und ohne
# Datum (Quelle u:cris, put-code 25608525) – vermutlich das Doktorat. Bitte bestätigen.
- id: doktorat
  section: education
  order: 0
  placeholder: true
  title:
    de: PLATZHALTER – Doktorat mit Fach, Universität und Beginn eintragen
    en: PLACEHOLDER – Add the doctorate with subject, university and start

# orcid-educations.json, put-code 17417939: „Master of Science“, Psychology,
# Universität Wien, 2019–2022.
# DE: „Psychology“ → „Psychologie“. EN: „University of Vienna“ ist der Name,
# unter dem ORCID dieselbe Universität sonst führt (ROR 03prydq77).
# Design-Beispiel „2020–2023 · MSc Psychologie, Universität Salzburg“ ist FALSCH.
- id: msc-psychologie
  section: education
  order: 1
  start: 2019
  end: 2022
  title:
    de: MSc Psychologie
    en: MSc Psychology
  detail:
    de: Universität Wien
    en: University of Vienna

# orcid-educations.json, put-code 17417945: „Bachelor of Science“, Psychology,
# Universität Wien, 2015–2019.
# Design-Beispiel „2017–2020 · BSc Psychologie, Universität Salzburg“ ist FALSCH.
- id: bsc-psychologie
  section: education
  order: 2
  start: 2015
  end: 2019
  title:
    de: BSc Psychologie
    en: BSc Psychology
  detail:
    de: Universität Wien
    en: University of Vienna

# --- Positionen ---------------------------------------------------------------

# orcid-employments.json, put-code 21786594: „ÖAW Praedoc“, Department of
# Clinical and Health Psychology, University of Vienna, 2023-10-01 bis 2026-09-30.
# Die Stelle endet am 30.09.2026. Die Seite zeigt den Zeitraum, nicht „seit“ –
# so bleibt der Eintrag auch nach dem Enddatum richtig. Danach bitte ergänzen,
# wie es weitergeht (und den Untertitel „ÖAW DOC-Fellow“ in site.yaml prüfen).
# DE: „ÖAW Praedoc“ → „ÖAW-Praedoc“ (Bindestrich nach deutscher Schreibung);
# „Department of Clinical and Health Psychology“ → „Institut für Klinische und
# Gesundheitspsychologie“ (so im Design); „University of Vienna“ → „Universität Wien“.
# Design-Beispiel: „seit 2023 · Prae-Doc-Forscherin, Institut für Klinische und
# Gesundheitspsychologie, Universität Wien“.
- id: oeaw-praedoc
  section: positions
  order: 1
  start: 2023-10-01
  end: 2026-09-30
  title:
    de: ÖAW-Praedoc
    en: ÖAW Praedoc
  detail:
    de: Institut für Klinische und Gesundheitspsychologie, Universität Wien
    en: Department of Clinical and Health Psychology, University of Vienna

# orcid-employments.json, put-code 20241267: „Study Coordinator“, 3rd Medical
# Department for Hematology and Oncology, Hanusch Hospital, Vienna,
# 2022-10 bis 2023-07-31. Nicht im Design.
# DE: „Study Coordinator“ → „Studienkoordinatorin“; „3rd Medical Department for
# Hematology and Oncology“ → „3. Medizinische Abteilung für Hämatologie und
# Onkologie“ (wörtlich – den offiziellen deutschen Namen der Abteilung bitte
# bestätigen); „Hanusch Hospital“ → „Hanusch-Krankenhaus“; „Vienna“ → „Wien“.
- id: hanusch-studienkoordination
  section: positions
  order: 2
  start: 2022-10
  end: 2023-07-31
  title:
    de: Studienkoordinatorin
    en: Study Coordinator
  detail:
    de: 3. Medizinische Abteilung für Hämatologie und Onkologie, Hanusch-Krankenhaus, Wien
    en: 3rd Medical Department for Hematology and Oncology, Hanusch Hospital, Vienna

