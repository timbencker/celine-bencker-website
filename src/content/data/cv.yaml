# --- Service & Mitgliedschaften -------------------------------------------------

# Peer Review: orcid-peer-reviews.json, eine Zeile je Gutachten (Abschlussjahr).
# Die Seite fasst alle zu einer Zeile „Reviewerin für Fachzeitschriften“ zusammen.
# Zeitschriftennamen über die Crossref-Journal-API zur ISSN
# (https://api.crossref.org/journals/<issn>), abgerufen 2026-09-16.
# Design-Beispiel: „laufend · Reviewerin für Fachzeitschriften, (Journals eintragen)“.

# issn:0306-4530, Elsevier: fünf Gutachten, alle 2025.
- id: review-psychoneuroendocrinology
  section: review
  order: 1
  journal: Psychoneuroendocrinology
  issn: 0306-4530
  years: [2025, 2025, 2025, 2025, 2025]

# issn:1472-1465 (Online-ISSN; Print 0007-1250), über Web of Science: 2025 und 2024.
- id: review-british-journal-of-psychiatry
  section: review
  order: 2
  journal: The British Journal of Psychiatry
  issn: 1472-1465
  years: [2025, 2024]

# issn:1878-531X (Online-ISSN; Print 1016-9040), Hogrefe, über Web of Science:
# 2023 und 2022.
- id: review-european-psychologist
  section: review
  order: 3
  journal: European Psychologist
  issn: 1878-531X
  years: [2023, 2022]

