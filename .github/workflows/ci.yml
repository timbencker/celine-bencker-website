name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      # Also enforces translation completeness — see src/i18n/pages.ts
      - run: npm run build

  e2e:
    # Accessibility and integrity suite — tests/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # The suite drives the runner's preinstalled Google Chrome
          # (`channel: 'chrome'`); nothing downloads a browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: google-chrome --version
      # Builds the site, serves it, and runs every check.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  lighthouse:
    # Lighthouse CI against the production build, as on tanh-lab/website:
    # every category must score at least 95 (the brief's target). The pages are
    # served under their base path and audited in the runner's Google Chrome —
    # tests/README.md explains the setup.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Builds, then audits every page in the sitemap plus the 404, three runs
      # each; performance is judged on the median run.
      - run: npm run lighthouse
      # Reports on success too: they are the record of the scores.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports
          path: .lighthouse/reports/
          retention-days: 14
