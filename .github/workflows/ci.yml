name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run check
      # Also enforces translation completeness — see src/i18n/pages.ts
      - run: npm run build

  e2e:
    # Accessibility and integrity suite — tests/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
        env:
          # The suite drives the runner's preinstalled Google Chrome
          # (`channel: 'chrome'`); nothing downloads a browser.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: google-chrome --version
      # Builds the site, serves it, and runs every check.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
